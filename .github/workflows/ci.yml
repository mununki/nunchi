# Tests and builds both input methods (64-bit and 32-bit) on every push and pull request; on a
# version tag (v0.1.0) also builds the installer and attaches it to a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add i686-pc-windows-msvc

      # The core's tests, and the input method typing the cases in crates\nunchi-typing-test\cases
      # into real EDIT and RichEdit controls (no keyboard).
      - name: Test
        run: cargo test --release -p nunchi-core -p nunchi-tsf -p nunchi-settings

      - name: Build (64-bit and 32-bit, and the settings window)
        run: |
          cargo build --release -p nunchi-tsf
          cargo build --release -p nunchi-tsf --target i686-pc-windows-msvc
          cargo build --release -p nunchi-settings

      - name: Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: scripts\build-installer.ps1

      # A draft: its notes are written, and it is looked over, before it's published.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem target\installer\Nunchi-Setup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName --title "눈치 (Nunchi) ${{ github.ref_name }}" --draft --generate-notes

  # Real keys typed into each kind of field (scripts\typing-tests.ps1), with the input method
  # registered on the runner. It needs the runner's desktop session to take keys and the
  # foreground: until that proves dependable there, a failure here doesn't fail the build.
  typing:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add i686-pc-windows-msvc

      - name: Build (64-bit and 32-bit)
        run: |
          cargo build --release -p nunchi-tsf
          cargo build --release -p nunchi-tsf --target i686-pc-windows-msvc

      # As the installer does: registered for 64-bit and 32-bit apps, readable from the sandbox
      # Store apps run in, and in the keyboard list (which adds Korean too).
      - name: Register
        shell: powershell
        run: |
          $x64 = (Resolve-Path target\release\nunchi_tsf.dll).Path
          $x86 = (Resolve-Path target\i686-pc-windows-msvc\release\nunchi_tsf.dll).Path
          foreach ($dir in (Split-Path $x64), (Split-Path $x86)) {
            icacls $dir /grant '*S-1-15-2-1:(OI)(CI)(RX)' '*S-1-15-2-2:(OI)(CI)(RX)' | Out-Null
          }
          & "$env:SystemRoot\System32\regsvr32.exe" /s $x64
          & "$env:SystemRoot\SysWOW64\regsvr32.exe" /s $x86
          & "$env:SystemRoot\System32\rundll32.exe" "$x64,AddToKeyboardList"

      - name: Typing tests
        shell: powershell
        run: scripts\typing-tests.ps1 -Installed -Yes
