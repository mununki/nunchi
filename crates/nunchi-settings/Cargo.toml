[package]
name = "nunchi-settings"
description = "Nunchi's settings window: settings, rules for apps and the words Nunchi learned"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nunchi-core = { path = "../nunchi-core" }
eframe = "0.37"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
