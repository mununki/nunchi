[package]
name = "araso-tsf"
description = "Araso as a Windows Text Services Framework input method"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "araso_tsf"
crate-type = ["cdylib"]

[features]
# A development build: its own class, profile and name ("Araso (개발)"), beside the installed one.
dev = []

[dependencies]
araso-core = { path = "../araso-core" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
